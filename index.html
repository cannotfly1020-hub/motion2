<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動作観察 & 骨格AI解析ツール</title>
  <!-- MediaPipe Pose & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #4dabf7;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; /* 描画はCanvasに統一 */
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls {
      width: 100%;
      max-width: 800px;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    button, label.file-btn {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: all 0.2s;
    }
    button:hover, label.file-btn:hover {
      background: #3d3d3d;
      border-color: #666;
    }
    button.primary, label.file-btn.primary {
      background: #1971c2;
      border-color: #1971c2;
    }
    button.primary:hover, label.file-btn.primary:hover {
      background: #1864ab;
    }
    input[type="file"] {
      display: none;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #4dabf7;
      cursor: pointer;
    }
    .metrics {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #aaa;
      justify-content: center;
    }
    .metric-val {
      color: #ffd43b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>動作観察 & 骨格解析</h1>
    <div class="metrics">
      <span>右膝屈曲: <span id="rKneeAngle" class="metric-val">--°</span></span>
      <span>体幹傾斜: <span id="trunkAngle" class="metric-val">--°</span></span>
    </div>
  </header>

  <div class="container">
    <video id="inputVideo" playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="slider-row">
      <input type="range" id="seekBar" value="0" min="0" step="0.033" disabled>
      <span id="timeDisplay" style="font-size: 0.8rem; min-width: 65px;">0.00s</span>
    </div>

    <div class="btn-row">
      <label class="file-btn primary">
        📁 動画を選択
        <input type="file" id="videoUploader" accept="video/*">
      </label>
      <button id="btnCamera">📷 カメラ起動</button>
      <button id="btnPlayPause" disabled>▶ 再生</button>
      <button id="btnPrevFrame" disabled>◀ 1コマ戻る</button>
      <button id="btnNextFrame" disabled>1コマ進む ▶</button>
      <button id="btnToggleGrid">線・グリッド表示</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPrevFrame = document.getElementById('btnPrevFrame');
    const btnNextFrame = document.getElementById('btnNextFrame');
    const btnCamera = document.getElementById('btnCamera');
    const uploader = document.getElementById('videoUploader');
    const rKneeSpan = document.getElementById('rKneeAngle');
    const trunkSpan = document.getElementById('trunkAngle');
    const btnToggleGrid = document.getElementById('btnToggleGrid');

    let showGrid = true;
    let isLiveCamera = false;
    let cameraUtil = null;

    // 1. MediaPipe Pose 初期化
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // 2. 角度計算関数 (度数法)
    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360.0 - angle;
      return angle;
    }

    // 体幹垂直傾斜角（肩と股関節の中心線 vs 垂直線）
    function calculateTrunkAngle(shoulder, hip) {
      const dx = hip.x - shoulder.x;
      const dy = hip.y - shoulder.y;
      const radians = Math.atan2(dx, dy); // 垂直下向き(0, 1)とのなす角
      return Math.abs(radians * 180.0 / Math.PI);
    }

    // 3. 骨格描画と結果処理
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 360;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // 元動画フレームの描画
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // グリッド線
      if (showGrid) {
        canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        canvasCtx.lineWidth = 1;
        for (let x = 0; x < canvasElement.width; x += 80) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(x, 0);
          canvasCtx.lineTo(x, canvasElement.height);
          canvasCtx.stroke();
        }
        for (let y = 0; y < canvasElement.height; y += 80) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(0, y);
          canvasCtx.lineTo(canvasElement.width, y);
          canvasCtx.stroke();
        }
      }

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const w = canvasElement.width;
        const h = canvasElement.height;

        // 骨格ライン接続定義
        const connections = [
          [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // 上肢
          [11, 23], [12, 24], [23, 24],                     // 体幹
          [23, 25], [25, 27], [24, 26], [26, 28]            // 下肢
        ];

        // 骨格線描画
        canvasCtx.strokeStyle = "#00ff88";
        canvasCtx.lineWidth = 3;
        connections.forEach(([i, j]) => {
          if (lm[i].visibility > 0.5 && lm[j].visibility > 0.5) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(lm[i].x * w, lm[i].y * h);
            canvasCtx.lineTo(lm[j].x * w, lm[j].y * h);
            canvasCtx.stroke();
          }
        });

        // 関節点描画
        canvasCtx.fillStyle = "#ff0055";
        lm.forEach((point) => {
          if (point.visibility > 0.5) {
            canvasCtx.beginPath();
            canvasCtx.arc(point.x * w, point.y * h, 4, 0, 2 * Math.PI);
            canvasCtx.fill();
          }
        });

        // 角度算出 (右股関節:24, 右膝:26, 右足首:28)
        if (lm[24].visibility > 0.5 && lm[26].visibility > 0.5 && lm[28].visibility > 0.5) {
          const rKnee = calculateAngle(lm[24], lm[26], lm[28]);
          rKneeSpan.innerText = `${rKnee.toFixed(1)}°`;

          // 関節横に数値をオーバーレイ
          canvasCtx.fillStyle = "rgba(0,0,0,0.7)";
          canvasCtx.fillRect(lm[26].x * w + 8, lm[26].y * h - 16, 60, 20);
          canvasCtx.fillStyle = "#ffd43b";
          canvasCtx.font = "bold 13px sans-serif";
          canvasCtx.fillText(`${rKnee.toFixed(0)}°`, lm[26].x * w + 14, lm[26].y * h - 2);
        }

        // 体幹傾斜 (右肩:12, 右股関節:24)
        if (lm[12].visibility > 0.5 && lm[24].visibility > 0.5) {
          const trunk = calculateTrunkAngle(lm[12], lm[24]);
          trunkSpan.innerText = `${trunk.toFixed(1)}°`;
        }
      }
      canvasCtx.restore();
    }

    // 4. 動画ファイル読み込み
    uploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (cameraUtil) {
        cameraUtil.stop();
        isLiveCamera = false;
      }

      videoElement.src = URL.createObjectURL(file);
      videoElement.load();
      videoElement.onloadedmetadata = () => {
        seekBar.max = videoElement.duration;
        seekBar.disabled = false;
        btnPlayPause.disabled = false;
        btnPrevFrame.disabled = false;
        btnNextFrame.disabled = false;
        processCurrentVideoFrame();
      };
    });

    // 5. カメラ起動
    btnCamera.addEventListener('click', async () => {
      if (isLiveCamera) return;
      isLiveCamera = true;
      videoElement.pause();
      
      cameraUtil = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      cameraUtil.start();
      
      seekBar.disabled = true;
      btnPlayPause.disabled = true;
      btnPrevFrame.disabled = true;
      btnNextFrame.disabled = true;
    });

    // 6. フレーム単位処理 (ファイル再生時)
    async function processCurrentVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await pose.send({ image: videoElement });
        seekBar.value = videoElement.currentTime;
        timeDisplay.innerText = `${videoElement.currentTime.toFixed(2)}s`;
        requestAnimationFrame(processCurrentVideoFrame);
      } else {
        await pose.send({ image: videoElement });
        seekBar.value = videoElement.currentTime;
        timeDisplay.innerText = `${videoElement.currentTime.toFixed(2)}s`;
      }
    }

    // 再生・一時停止
    btnPlayPause.addEventListener('click', () => {
      if (videoElement.paused) {
        videoElement.play();
        btnPlayPause.innerText = '⏸ 一時停止';
        processCurrentVideoFrame();
      } else {
        videoElement.pause();
        btnPlayPause.innerText = '▶ 再生';
      }
    });

    // シークバー操作
    seekBar.addEventListener('input', () => {
      videoElement.currentTime = parseFloat(seekBar.value);
      processCurrentVideoFrame();
    });

    // 1コマ戻る (約30fps想定: 0.033秒)
    btnPrevFrame.addEventListener('click', () => {
      videoElement.pause();
      btnPlayPause.innerText = '▶ 再生';
      videoElement.currentTime = Math.max(0, videoElement.currentTime - 0.033);
      setTimeout(processCurrentVideoFrame, 50);
    });

    // 1コマ進む
    btnNextFrame.addEventListener('click', () => {
      videoElement.pause();
      btnPlayPause.innerText = '▶ 再生';
      videoElement.currentTime = Math.min(videoElement.duration, videoElement.currentTime + 0.033);
      setTimeout(processCurrentVideoFrame, 50);
    });

    // グリッドトグル
    btnToggleGrid.addEventListener('click', () => {
      showGrid = !showGrid;
      processCurrentVideoFrame();
    });
  </script>
</body>
</html>
