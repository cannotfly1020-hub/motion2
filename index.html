<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="icon.png.JPG">
<link rel="icon" type="image/jpeg" href="icon.png.JPG">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>動作観察 - 動作分析Pro</title>

<!-- AI解析ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    
    #header { width: 100%; background: #1c1c1e; padding-top: calc(6px + env(safe-area-inset-top)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; z-index: 10; flex-shrink: 0; }
    .header-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .header-top-row::-webkit-scrollbar { display: none; }
    .btn-group-header { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; flex-shrink: 0; }
    
    .hdr-btn { -webkit-appearance: none; appearance: none; background: #007aff; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .hdr-btn.secondary { background: #3a3a3c; }
    .hdr-btn.compare-parallel { background: #af52de; color: #fff; }
    .hdr-btn.compare-overlay { background: #ff2d55; color: #fff; }
    .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
    .hdr-btn.rec-btn { background: #ff3b30; color: #fff; }
    .hdr-btn.rec-active { background: #ff453a; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    #scale-info-text { font-size: 10px; color: #ff9500; font-weight: 600; white-space: nowrap; margin-left: auto; flex-shrink: 0; padding-left: 4px; }
    
    #result-box { width: 100%; background: #262629; border-radius: 6px; padding: 6px 10px; border: 1px solid #3a3a3c; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .result-text-area { flex: 1; min-width: 0; }
    #main-result { color: #00ffcc; font-size: 12px; font-weight: bold; line-height: 1.2; }
    #sub-result { color: #aaa; font-size: 10px; margin-top: 2px; font-weight: 500; line-height: 1.2; }
    #btn-confirm-scale { display: none; background: #ff9500; color: #000; font-size: 11px; font-weight: bold; padding: 5px 10px; border: none; border-radius: 6px; cursor: pointer; flex-shrink: 0; white-space: nowrap; }

    #stage { width: 100%; position: relative; flex: 1; min-height: 0; display: flex; background: #000; overflow: hidden; }
    .video-pane { position: relative; flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    .zoom-target { width: 100%; height: 100%; position: relative; transform-origin: center center; }
    #pane2 { display: none; border-left: 2px solid #555; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    
    #controls { width: 100%; background: #1c1c1e; padding-top: 5px; padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #333; flex-shrink: 0; }
    .seek-container { display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 14px; flex-shrink: 0; text-align: center; }
    .seek-label.v2 { color: #af52de; }
    input[type=range] { flex: 1; height: 18px; accent-color: #007aff; }
    #seekbar2 { accent-color: #af52de; }
    #perp-slider { accent-color: #ff2d55; }
    #sim-slider { accent-color: #30d158; }

    .auto-joint-row { display: flex; align-items: center; gap: 4px; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .auto-joint-row::-webkit-scrollbar { display: none; }
    .joint-chip { background: #2c2c2e; color: #888; border: 1px solid #444; border-radius: 12px; padding: 4px 9px; font-size: 10px; font-weight: bold; white-space: nowrap; cursor: pointer; }
    .joint-chip.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

    .mode-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button.ctrl-btn { -webkit-appearance: none; appearance: none; width: 100%; padding: 6px 0; background: #2c2c2e; color: #ccc; border: 1px solid #444; border-radius: 6px; font-size: 10.5px; font-weight: 600; cursor: pointer; text-align: center; transition: 0.15s; }
    button.ctrl-btn:active { background: #444; transform: scale(0.97); }
    button.mode-active { background: #007aff !important; color: #fff !important; font-weight: bold; border-color: #007aff !important; }
    #btn-mode-auto.mode-active { background: #00ffcc !important; color: #000 !important; border-color: #00ffcc !important; }
    #btn-mode-dist.mode-active { background: #ffd60a !important; color: #000 !important; border-color: #ffd60a !important; }
    #btn-mode-sim.mode-active { background: #30d158 !important; color: #000 !important; border-color: #30d158 !important; }
    #btn-mode-scale.mode-active { background: #ff9500 !important; color: #000 !important; border-color: #ff9500 !important; }

    .playback-row { width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr; gap: 4px; }
    #btn-play { background: #34c759; color: #000; font-weight: bold; }
    #btn-clear { background: #3a3a3c; color: #ff453a; font-weight: bold; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-card { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px; padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
    .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .modal-input-row input { width: 100px; font-size: 16px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; user-select: auto; -webkit-user-select: auto; }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button { -webkit-appearance: none; appearance: none; flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
    #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <button class="hdr-btn" onclick="triggerPickVideo(1)">動画①</button>
            <button class="hdr-btn secondary" id="btn-pick2" style="display:none;" onclick="triggerPickVideo(2)">動画②</button>
            <button class="hdr-btn secondary" id="btn-toggle-compare" onclick="toggleCompareMode()">1画面</button>
            <button class="hdr-btn fps-badge" id="btn-fps" onclick="toggleFPS()">30fps</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 静止画</button>
            <button class="hdr-btn rec-btn" id="btn-record" onclick="toggleRecording()">🎥 録画開始</button>
        </div>
        <span id="scale-info-text">物差し: 未設定</span>
        <input type="file" id="file-input-1" accept="video/*" style="display:none">
        <input type="file" id="file-input-2" accept="video/*" style="display:none">
    </div>
    <div id="result-box">
        <div class="result-text-area">
            <div id="main-result">動画①を選択してください</div>
            <div id="sub-result">AIが骨格・関節角度・重心を自動追従します</div>
        </div>
        <button id="btn-confirm-scale" onclick="openScaleModal()">📏 長さ確定</button>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="pane1">
        <div class="zoom-target" id="zoom-target-1">
            <video id="video1" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <canvas id="canvas1"></canvas>
        </div>
    </div>
    <div class="video-pane" id="pane2">
        <div class="zoom-target" id="zoom-target-2">
            <video id="video2" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <canvas id="canvas2"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-container">
        <div class="seek-row">
            <span class="seek-label">①</span>
            <input type="range" id="seekbar1" min="0" max="100" value="0" step="0.001">
        </div>
        <div class="seek-row" id="seek-row-2" style="display:none;">
            <span class="seek-label v2">②</span>
            <input type="range" id="seekbar2" min="0" max="100" value="0" step="0.001">
        </div>
    </div>

    <!-- AI自動追従 関節クイックセレクター -->
    <div class="auto-joint-row">
        <span style="font-size:10px; font-weight:bold; color:#00ffcc; white-space:nowrap;">自動追従:</span>
        <div class="joint-chip active" id="chip-kneeR" onclick="selectAutoJoint('kneeR')">右膝</div>
        <div class="joint-chip" id="chip-kneeL" onclick="selectAutoJoint('kneeL')">左膝</div>
        <div class="joint-chip" id="chip-elbowR" onclick="selectAutoJoint('elbowR')">右肘</div>
        <div class="joint-chip" id="chip-elbowL" onclick="selectAutoJoint('elbowL')">左肘</div>
        <div class="joint-chip" id="chip-hipR" onclick="selectAutoJoint('hipR')">右股関節</div>
        <div class="joint-chip" id="chip-hipL" onclick="selectAutoJoint('hipL')">左股関節</div>
        <div class="joint-chip" id="chip-trunk" onclick="selectAutoJoint('trunk')">体幹傾斜</div>
    </div>
    
    <div class="mode-grid">
        <button class="ctrl-btn mode-active" id="btn-mode-auto" onclick="setMode('auto')">🤖 AI自動追従</button>
        <button class="ctrl-btn" id="btn-mode-dist" onclick="setMode('distance')">⚡️ 速度(2点)</button>
        <button class="ctrl-btn" id="btn-mode-sim" onclick="setMode('sim')">🎯 予測(+10°)</button>
        <button class="ctrl-btn" id="btn-mode-perp" onclick="setMode('perp')">📏 垂直線</button>

        <button class="ctrl-btn" id="btn-mode-cog" onclick="setMode('cog')">📍 重心軌跡</button>
        <button class="ctrl-btn" id="btn-mode-scale" onclick="setMode('scale')">📐 物差し</button>
        <button class="ctrl-btn" id="btn-mode-zoom" onclick="setMode('zoom')">🔍 ズーム</button>
        <button class="ctrl-btn" id="btn-mode-manual-angle" onclick="setMode('angle')">✋ 手動角度</button>
    </div>
    
    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率(画面<span id="zoom-target-label">①</span>)</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
        <button class="ctrl-btn" style="width:auto; padding:4px 10px; background:#444;" onclick="resetZoom()">リセット</button>
    </div>

    <div id="perp-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#ff2d55; white-space:nowrap;">垂直線移動</span>
        <input type="range" id="perp-slider" min="0" max="100" step="0.5" value="50">
    </div>

    <div id="sim-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#30d158; white-space:nowrap;">改善角: <span id="sim-deg-val">+10°</span></span>
        <input type="range" id="sim-slider" min="-30" max="30" step="1" value="10">
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" id="btnStepBack" onclick="stepFrame(-1)">◀ -1</button>
        <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶ 再生</button>
        <button class="ctrl-btn" id="btnStepForward" onclick="stepFrame(1)">+1 ▶</button>
        <button class="ctrl-btn" id="btn-speed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" id="btn-clear" onclick="clearCurrentPoints()">消去</button>
    </div>
</div>

<div id="scale-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3 id="scale-modal-title">物差しの長さ設定</h3>
        <p>指定した2点間の実際の長さを入力</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeScaleModal()">キャンセル</button>
            <button style="background:#ff9500; color:#000;" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 静止画キャプチャ</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
    const video1 = document.getElementById('video1');
    const canvas1 = document.getElementById('canvas1');
    const ctx1 = canvas1.getContext('2d');

    const video2 = document.getElementById('video2');
    const canvas2 = document.getElementById('canvas2');
    const ctx2 = canvas2.getContext('2d');

    const pane2 = document.getElementById('pane2');
    const btnPick2 = document.getElementById('btn-pick2');
    const btnToggleCompare = document.getElementById('btn-toggle-compare');
    const btnFps = document.getElementById('btn-fps');
    const btnRecord = document.getElementById('btn-record');
    const seekbar1 = document.getElementById('seekbar1');
    const seekbar2 = document.getElementById('seekbar2');
    const seekRow2 = document.getElementById('seek-row-2');
    const mainResult = document.getElementById('main-result');
    const subResult = document.getElementById('sub-result');
    const btnConfirmScale = document.getElementById('btn-confirm-scale');
    const scaleInfoText = document.getElementById('scale-info-text');
    const btnPlay = document.getElementById('btn-play');
    const btnSpeed = document.getElementById('btn-speed');

    const fileInput1 = document.getElementById('file-input-1');
    const fileInput2 = document.getElementById('file-input-2');

    const perpSlider = document.getElementById('perp-slider');
    const simSlider = document.getElementById('sim-slider');
    const simDegVal = document.getElementById('sim-deg-val');
    
    const scaleModalOverlay = document.getElementById('scale-modal-overlay');
    const scaleModalTitle = document.getElementById('scale-modal-title');
    const scaleInputValue = document.getElementById('scale-input-value');

    let compareMode = 0; 
    let currentMode = 'auto';
    let selectedAutoJoint = 'kneeR';
    
    let currentFPS = 30.0;
    const fpsList = [30, 60, 120, 240];
    let fpsIdx = 0;

    let isProcessing = false;
    let animFrameId = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordCanvas = null;
    let recordCtx = null;

    let latestLandmarks1 = null;

    let autoPeakMax = -Infinity;
    let autoPeakMin = Infinity;

    const state = {
        1: { points: [], scalePoints: [], perpPoints: [], cogPoints: [], pxPerCm: null, currentCoM: null },
        2: { points: [], scalePoints: [], perpPoints: [], cogPoints: [], pxPerCm: null }
    };
    
    const viewState = {
        1: { scale: 1, x: 0, y: 0 },
        2: { scale: 1, x: 0, y: 0 }
    };

    let scaleTarget = 1;
    let lastActiveTarget = 1;
    let draggingPoint = null;

    function toggleFPS() {
        fpsIdx = (fpsIdx + 1) % fpsList.length;
        currentFPS = fpsList[fpsIdx];
        btnFps.innerText = `${currentFPS}fps`;
    }

    let isPlaying = false;
    const playbackRates = [1.0, 0.5, 0.25];
    let currentRateIdx = 0;

    function selectAutoJoint(jointKey) {
        selectedAutoJoint = jointKey;
        autoPeakMax = -Infinity;
        autoPeakMin = Infinity;
        document.querySelectorAll('.joint-chip').forEach(c => c.classList.remove('active'));
        const activeChip = document.getElementById(`chip-${jointKey}`);
        if (activeChip) activeChip.classList.add('active');
        if (currentMode !== 'auto') setMode('auto');
        if (latestLandmarks1) {
            const box = getVideoRenderRect(video1, canvas1);
            updateAutoResults(latestLandmarks1, box);
        }
        redraw();
    }

    function calcAngle(p1, p2, p3) {
        const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
        const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
        const dot = v1.x * v2.x + v1.y * v2.y;
        const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
        if (mag1 === 0 || mag2 === 0) return 0;
        return Math.acos(Math.max(-1, Math.min(1, dot / (mag1 * mag2)))) * (180 / Math.PI);
    }

    function simulateJointAngle(p2, p3, deltaDeg) {
        const rad = deltaDeg * (Math.PI / 180);
        const dx = p3.x - p2.x;
        const dy = p3.y - p2.y;
        return {
            x: p2.x + (dx * Math.cos(rad) - dy * Math.sin(rad)),
            y: p2.y + (dx * Math.sin(rad) + dy * Math.cos(rad))
        };
    }

    function updateAutoResults(lm, box) {
        if (!lm) return;
        const toPx = (p) => ({ x: box.x + p.x * box.w, y: box.y + p.y * box.h });

        const shL = lm[11], shR = lm[12], elL = lm[13], elR = lm[14], wrL = lm[15], wrR = lm[16];
        const hipL = lm[23], hipR = lm[24], kneeL = lm[25], kneeR = lm[26], ankL = lm[27], ankR = lm[28];

        let curAngle = 0;
        let jointName = "";

        if (selectedAutoJoint === 'kneeR' && hipR && kneeR && ankR) {
            curAngle = calcAngle(toPx(hipR), toPx(kneeR), toPx(ankR)); jointName = "右膝角度";
        } else if (selectedAutoJoint === 'kneeL' && hipL && kneeL && ankL) {
            curAngle = calcAngle(toPx(hipL), toPx(kneeL), toPx(ankL)); jointName = "左膝角度";
        } else if (selectedAutoJoint === 'elbowR' && shR && elR && wrR) {
            curAngle = calcAngle(toPx(shR), toPx(elR), toPx(wrR)); jointName = "右肘角度";
        } else if (selectedAutoJoint === 'elbowL' && shL && elL && wrL) {
            curAngle = calcAngle(toPx(shL), toPx(elL), toPx(wrL)); jointName = "左肘角度";
        } else if (selectedAutoJoint === 'hipR' && shR && hipR && kneeR) {
            curAngle = calcAngle(toPx(shR), toPx(hipR), toPx(kneeR)); jointName = "右股関節角度";
        } else if (selectedAutoJoint === 'hipL' && shL && hipL && kneeL) {
            curAngle = calcAngle(toPx(shL), toPx(hipL), toPx(kneeL)); jointName = "左股関節角度";
        } else if (selectedAutoJoint === 'trunk' && shL && shR && hipL && hipR) {
            const midSh = { x: (toPx(shL).x + toPx(shR).x)/2, y: (toPx(shL).y + toPx(shR).y)/2 };
            const midHip = { x: (toPx(hipL).x + toPx(hipR).x)/2, y: (toPx(hipL).y + toPx(hipR).y)/2 };
            curAngle = Math.abs(Math.atan2(midSh.x - midHip.x, -(midSh.y - midHip.y)) * (180 / Math.PI));
            jointName = "体幹傾斜角";
        }

        if (curAngle > 0) {
            if (curAngle > autoPeakMax) autoPeakMax = curAngle;
            if (curAngle < autoPeakMin) autoPeakMin = curAngle;
        }

        if (shL && shR && hipL && hipR) {
            const pShL = toPx(shL), pShR = toPx(shR), pHipL = toPx(hipL), pHipR = toPx(hipR);
            const comPt = {
                x: (pShL.x + pShR.x + pHipL.x + pHipR.x) * 0.25,
                y: (pShL.y + pShR.y + pHipL.y + pHipR.y) * 0.25,
                time: video1.currentTime
            };
            state[1].currentCoM = comPt;
            
            // 重心モード時、自動で軌跡配列に追加
            if (currentMode === 'cog') {
                const cogs = state[1].cogPoints;
                if (cogs.length === 0 || Math.hypot(comPt.x - cogs[cogs.length-1].x, comPt.y - cogs[cogs.length-1].y) > 3) {
                    cogs.push(comPt);
                    if (cogs.length > 100) cogs.shift();
                }
            }
        }

        if (currentMode === 'auto') {
            mainResult.innerHTML = `🤖 ${jointName}: <span style="color:#00ffcc; font-size:14px;">${curAngle.toFixed(1)}°</span> ｜ 最大: <span style="color:#ffd60a;">${autoPeakMax > -Infinity ? autoPeakMax.toFixed(1) + '°' : '---'}</span> 最小: <span style="color:#ff375f;">${autoPeakMin < Infinity ? autoPeakMin.toFixed(1) + '°' : '---'}</span>`;
            subResult.innerHTML = "動画再生・コマ送りでリアルタイム更新中";
        }
    }

    async function togglePlay() {

                if (video1.duration) await video1.play();

    function stepFrame(dir) {

        if (compareMode > 0 && video2 && !isNaN(video2.duration) && video2.duration > 0) {
            video2.currentTime = Math.max(0, Math.min(video2.duration, video2.currentTime + stepSec));

    }

    function clearCurrentPoints() {
        state[1].points = [];
        state[1].scalePoints = [];
        state[1].perpPoints = [];
        state[1].cogPoints = [];
        autoPeakMax = -Infinity;
        autoPeakMin = Infinity;
        btnConfirmScale.style.display = 'none';

        redraw();
    }

    function getVideoRenderRect(vid, cvs) {
        if (!vid.videoWidth) return { width: cvs.width, height: cvs.height, x: 0, y: 0 };
        const videoRatio = vid.videoWidth / vid.videoHeight;
        const canvasRatio = cvs.width / cvs.height;
        let renderWidth, renderHeight, offsetX = 0, offsetY = 0;

        if (videoRatio > canvasRatio) {
            renderWidth = cvs.width;
            renderHeight = cvs.width / videoRatio;
            offsetY = (cvs.height - renderHeight) / 2;
        } else {
            renderHeight = cvs.height;
            renderWidth = cvs.height * videoRatio;
            offsetX = (cvs.width - renderWidth) / 2;
        }
        return { width: renderWidth, height: renderHeight, x: offsetX, y: offsetY };
    }

    function findHitPoint(pts, pos) {
        for (let i = 0; i < pts.length; i++) {
            if (Math.hypot(pts[i].x - pos.x, pts[i].y - pos.y) < 25) return i;
        }
        return -1;
    }

    function redraw() {
        [ {idx: 1, c: canvas1, ctx: ctx1, v: video1}, {idx: 2, c: canvas2, ctx: ctx2, v: video2} ].forEach(item => {
            if (compareMode === 0 && item.idx === 2) return;
            const s = state[item.idx];
            item.ctx.clearRect(0, 0, item.c.width, item.c.height);

            const box = getVideoRenderRect(item.v, item.c);
            const toPx = (p) => ({ x: box.x + p.x * box.w, y: box.y + p.y * box.h });

            // AI骨格＆自動角度の描画
            if (item.idx === 1 && latestLandmarks1) {
                const lm = latestLandmarks1;
                
                item.ctx.save();
                item.ctx.lineWidth = 3;
                const drawConn = (i, j, col) => {
                    if (lm[i] && lm[j]) {
                        const p1 = toPx(lm[i]), p2 = toPx(lm[j]);
                        item.ctx.strokeStyle = col;
                        item.ctx.beginPath(); item.ctx.moveTo(p1.x, p1.y); item.ctx.lineTo(p2.x, p2.y); item.ctx.stroke();
                    }
                };
                [[11, 13], [13, 15], [23, 25], [25, 27]].forEach(([i, j]) => drawConn(i, j, 'rgba(0, 255, 204, 0.6)'));
                [[12, 14], [14, 16], [24, 26], [26, 28]].forEach(([i, j]) => drawConn(i, j, 'rgba(255, 214, 10, 0.6)'));
                drawConn(11, 12, '#ff375f'); drawConn(23, 24, '#007aff');
                item.ctx.restore();

                const highlightJoint = (pKey, col) => {
                    if (lm[pKey]) {
                        const pt = toPx(lm[pKey]);
                        item.ctx.fillStyle = col;
                        item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2); item.ctx.fill();
                        item.ctx.strokeStyle = '#fff'; item.ctx.lineWidth = 2; item.ctx.stroke();
                    }
                };
                if (selectedAutoJoint === 'kneeR') highlightJoint(26, '#ffd60a');
                if (selectedAutoJoint === 'kneeL') highlightJoint(25, '#00ffcc');
                if (selectedAutoJoint === 'elbowR') highlightJoint(14, '#ffd60a');
                if (selectedAutoJoint === 'elbowL') highlightJoint(13, '#00ffcc');
                if (selectedAutoJoint === 'hipR') highlightJoint(24, '#ffd60a');
                if (selectedAutoJoint === 'hipL') highlightJoint(23, '#00ffcc');

                if (s.currentCoM) {
                    item.ctx.fillStyle = '#ff375f';
                    item.ctx.beginPath(); item.ctx.arc(s.currentCoM.x, s.currentCoM.y, 6, 0, Math.PI * 2); item.ctx.fill();
                    item.ctx.fillStyle = '#fff'; item.ctx.font = 'bold 9px sans-serif';
                    item.ctx.fillText("CoM", s.currentCoM.x + 8, s.currentCoM.y + 3);
                }
            }

            // 重心軌跡の描画
            if (s.cogPoints.length > 0) {
                item.ctx.save();
                item.ctx.strokeStyle = '#ff375f';
                item.ctx.lineWidth = 2;
                item.ctx.beginPath();
                s.cogPoints.forEach((pt, i) => {
                    if (i === 0) item.ctx.moveTo(pt.x, pt.y);
                    else item.ctx.lineTo(pt.x, pt.y);
                });
                item.ctx.stroke();

                s.cogPoints.forEach((pt, i) => {
                    item.ctx.fillStyle = (i === s.cogPoints.length - 1) ? '#00ffcc' : '#ff375f';
                    item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); item.ctx.fill();
                });
                item.ctx.restore();
            }

            // 垂直線の描画
            if (s.perpPoints.length > 0) {
                item.ctx.save();
                s.perpPoints.forEach((pt, i) => {
                    item.ctx.fillStyle = '#ff2d55';
                    item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2); item.ctx.fill();
                });
                if (s.perpPoints.length === 2) {
                    const p1 = s.perpPoints[0], p2 = s.perpPoints[1];
                    item.ctx.strokeStyle = '#00ffcc'; item.ctx.lineWidth = 2;
                    item.ctx.beginPath(); item.ctx.moveTo(p1.x, p1.y); item.ctx.lineTo(p2.x, p2.y); item.ctx.stroke();

                    const t = parseFloat(perpSlider.value) / 100;
                    const pmX = p1.x + (p2.x - p1.x) * t, pmY = p1.y + (p2.y - p1.y) * t;
                    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy);
                    if (len > 0) {
                        const nx = -dy / len, ny = dx / len, perpLen = 2000;
                        item.ctx.strokeStyle = '#ff2d55'; item.ctx.lineWidth = 2; item.ctx.setLineDash([5, 4]);
                        item.ctx.beginPath(); item.ctx.moveTo(pmX - nx * perpLen, pmY - ny * perpLen); item.ctx.lineTo(pmX + nx * perpLen, pmY + ny * perpLen); item.ctx.stroke();
                    }
                }
                item.ctx.restore();
            }

            // 物差しラインの描画
            if (s.scalePoints.length > 0) {
                item.ctx.save();
                item.ctx.strokeStyle = '#ff9500'; item.ctx.fillStyle = '#ff9500'; item.ctx.lineWidth = 3;
                s.scalePoints.forEach((pt, i) => {
                    item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2); item.ctx.fill();
                    item.ctx.fillStyle = '#fff'; item.ctx.font = 'bold 10px sans-serif'; item.ctx.fillText(`点${i+1}`, pt.x+9, pt.y-4); item.ctx.fillStyle = '#ff9500';
                });
                if (s.scalePoints.length === 2) {
                    item.ctx.beginPath(); item.ctx.moveTo(s.scalePoints[0].x, s.scalePoints[0].y); item.ctx.lineTo(s.scalePoints[1].x, s.scalePoints[1].y); item.ctx.stroke();
                }
                item.ctx.restore();
            }

            // 手動ポイント＆可動域予測
            if (s.points.length > 0) {
                item.ctx.save();
                item.ctx.strokeStyle = '#ffd60a'; item.ctx.fillStyle = '#ffd60a'; item.ctx.lineWidth = 3;
                s.points.forEach((pt, i) => {
                    item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2); item.ctx.fill();
                    item.ctx.fillStyle = '#fff'; item.ctx.font = 'bold 10px sans-serif'; item.ctx.fillText(`点${i+1}`, pt.x+8, pt.y-4); item.ctx.fillStyle = '#ffd60a';
                });
                if (s.points.length >= 2) {
                    item.ctx.beginPath(); item.ctx.moveTo(s.points[0].x, s.points[0].y); item.ctx.lineTo(s.points[1].x, s.points[1].y);
                    if (s.points.length === 3) item.ctx.lineTo(s.points[2].x, s.points[2].y);
                    item.ctx.stroke();
                }

                if (currentMode === 'sim' && s.points.length === 3) {
                    const p2 = s.points[1], p3 = s.points[2], deltaDeg = parseFloat(simSlider.value), simP3 = simulateJointAngle(p2, p3, deltaDeg);
                    item.ctx.strokeStyle = '#30d158'; item.ctx.fillStyle = '#30d158'; item.ctx.lineWidth = 3; item.ctx.setLineDash([5, 4]);
                    item.ctx.beginPath(); item.ctx.moveTo(p2.x, p2.y); item.ctx.lineTo(simP3.x, simP3.y); item.ctx.stroke();
                    item.ctx.beginPath(); item.ctx.arc(simP3.x, simP3.y, 6, 0, Math.PI * 2); item.ctx.fill();
                }
                item.ctx.restore();
            }
        });
    }

    // タップ＆ドラッグ処理（完全実装）
    [ {c: canvas1, idx: 1}, {c: canvas2, idx: 2} ].forEach(item => {
        item.c.addEventListener('pointerdown', (e) => {
            const rect = item.c.getBoundingClientRect();
            const pt = { x: (e.clientX - rect.left) * (item.c.width / rect.width), y: (e.clientY - rect.top) * (item.c.height / rect.height) };
            const s = state[item.idx];
            lastActiveTarget = item.idx;

            if (currentMode === 'scale') {
                scaleTarget = item.idx;
                const hit = findHitPoint(s.scalePoints, pt);
                if (hit !== -1) {
                    draggingPoint = { array: s.scalePoints, index: hit };
                    try { item.c.setPointerCapture(e.pointerId); } catch(err){}
                } else {
                    if (s.scalePoints.length >= 2) s.scalePoints = [];
                    s.scalePoints.push(pt);
                    if (s.scalePoints.length === 2) btnConfirmScale.style.display = 'inline-block';
                }
                redraw();
                return;
            }

            if (currentMode === 'perp') {
                const hit = findHitPoint(s.perpPoints, pt);
                if (hit !== -1) {
                    draggingPoint = { array: s.perpPoints, index: hit };
                    try { item.c.setPointerCapture(e.pointerId); } catch(err){}
                } else {
                    if (s.perpPoints.length >= 2) s.perpPoints = [];
                    s.perpPoints.push(pt);
                    if (s.perpPoints.length === 2) document.getElementById('perp-controls').style.display = 'flex';
                }
                redraw();
                return;
            }

            if (currentMode === 'cog') {
                s.cogPoints.push({ x: pt.x, y: pt.y, time: video1.currentTime });
                mainResult.innerHTML = `手動重心プロット: <span style="color:#00ffcc;">${s.cogPoints.length}点</span>`;
                redraw();
                return;
            }

            if (currentMode === 'distance') {
                if (s.points.length >= 2) s.points = [];
                s.points.push({ x: pt.x, y: pt.y, time: video1.currentTime });
                if (s.points.length === 2) {
                    const dist = Math.hypot(s.points[1].x - s.points[0].x, s.points[1].y - s.points[0].y);
                    const dt = Math.abs(s.points[1].time - s.points[0].time);
                    const distText = s.pxPerCm ? `${(dist / s.pxPerCm).toFixed(1)} cm` : `${dist.toFixed(1)} px`;
                    const speedKMH = (s.pxPerCm && dt > 0) ? ` ｜ 速度: ${(((dist / s.pxPerCm) / 100) / dt * 3.6).toFixed(1)} km/h` : "";
                    mainResult.innerHTML = `距離: <span style="color:#ffd60a;">${distText}</span>${speedKMH}`;
                }
                redraw();
                return;
            }

            if (currentMode === 'angle' || currentMode === 'sim') {
                const hit = findHitPoint(s.points, pt);
                if (hit !== -1) {
                    draggingPoint = { array: s.points, index: hit };
                    try { item.c.setPointerCapture(e.pointerId); } catch(err){}
                } else {
                    if (s.points.length >= 3) s.points = [];
                    s.points.push(pt);
                    if (s.points.length === 3) {
                        const angle = calcAngle(s.points[0], s.points[1], s.points[2]);
                        mainResult.innerHTML = `手動角度: <span style="color:#00ffcc;">${angle.toFixed(1)}°</span>`;
                    }
                }
                redraw();
            }
        });

        item.c.addEventListener('pointermove', (e) => {
            if (draggingPoint) {
                const rect = item.c.getBoundingClientRect();
                const pt = { x: (e.clientX - rect.left) * (item.c.width / rect.width), y: (e.clientY - rect.top) * (item.c.height / rect.height) };
                draggingPoint.array[draggingPoint.index].x = pt.x;
                draggingPoint.array[draggingPoint.index].y = pt.y;
                redraw();
            }
        });

        item.c.addEventListener('pointerup', (e) => {
            if (draggingPoint) {
                try { item.c.releasePointerCapture(e.pointerId); } catch(err){}
                draggingPoint = null;
            }
        });
    });

    function openScaleModal() {
        const s = state[scaleTarget];
        if (s.scalePoints.length !== 2) return;
        scaleModalOverlay.style.display = 'flex';
        scaleInputValue.focus();
    }
    function closeScaleModal() { scaleModalOverlay.style.display = 'none'; }
    function submitScaleModal() {
        const s = state[scaleTarget];
        const val = parseFloat(scaleInputValue.value);
        if (val && val > 0 && s.scalePoints.length === 2) {
            const dist = Math.hypot(s.scalePoints[1].x - s.scalePoints[0].x, s.scalePoints[1].y - s.scalePoints[0].y);
            s.pxPerCm = dist / val;
            scaleInfoText.innerText = `物差し: ${(s.pxPerCm).toFixed(1)}px/cm`;
            closeScaleModal();
            setMode('auto');
        }
    }

    function captureSnapshot() {
        if (!video1.videoWidth) { alert("動画が読み込まれていません"); return; }
        const snapCanvas = document.createElement('canvas'), snapCtx = snapCanvas.getContext('2d');
        snapCanvas.width = canvas1.width; snapCanvas.height = canvas1.height + 60;
        snapCtx.fillStyle = '#000'; snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
        const r1 = getVideoRenderRect(video1, canvas1);
        snapCtx.drawImage(video1, r1.x, r1.y, r1.width, r1.height);
        snapCtx.drawImage(canvas1, 0, 0);
        snapCtx.fillStyle = '#1c1c1e'; snapCtx.fillRect(0, canvas1.height, snapCanvas.width, 60);
        snapCtx.fillStyle = '#00ffcc'; snapCtx.font = 'bold 13px sans-serif';
        snapCtx.fillText(mainResult.innerText, 15, canvas1.height + 24);
        snapCtx.fillStyle = '#ccc'; snapCtx.font = '10px sans-serif';
        snapCtx.fillText(subResult.innerText, 15, canvas1.height + 44);
        document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png');
        document.getElementById('snapshot-modal-overlay').style.display = 'flex';
    }
    function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }

    function toggleRecording() {
        if (!video1.videoWidth) return;
        if (!isRecording) {
            recordedChunks = [];
            recordCanvas = document.createElement('canvas');
            recordCanvas.width = canvas1.width; recordCanvas.height = canvas1.height + 50;
            recordCtx = recordCanvas.getContext('2d');

            function drawRecordFrame() {
                if (!isRecording) return;
                recordCtx.fillStyle = '#000'; recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);
                const r1 = getVideoRenderRect(video1, canvas1);
                recordCtx.drawImage(video1, r1.x, r1.y, r1.width, r1.height);
                recordCtx.drawImage(canvas1, 0, 0);
                recordCtx.fillStyle = '#1c1c1e'; recordCtx.fillRect(0, canvas1.height, recordCanvas.width, 50);
                recordCtx.fillStyle = '#00ffcc'; recordCtx.font = 'bold 12px sans-serif';
                recordCtx.fillText(mainResult.innerText, 12, canvas1.height + 22);
                requestAnimationFrame(drawRecordFrame);
            }

            const stream = recordCanvas.captureStream(currentFPS);
            try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' }); } catch(e) { mediaRecorder = new MediaRecorder(stream); }
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = `動作観察_${Date.now()}.mp4`; document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            };
            mediaRecorder.start(); isRecording = true;
            btnRecord.innerText = '⏹ 録画停止'; btnRecord.classList.add('rec-active');
            drawRecordFrame(); if (video1.paused) togglePlay();
        } else {
            isRecording = false;
            mediaRecorder.stop(); btnRecord.innerText = '🎥 録画開始'; btnRecord.classList.remove('rec-active');
            if (!video1.paused) togglePlay();
        }
    }

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    pose.onResults((results) => {
        if (!results.poseLandmarks) { 
            latestLandmarks1 = null; 
            redraw(); 
            return; 
        }
        latestLandmarks1 = results.poseLandmarks;
        const box = getVideoRenderRect(video1, canvas1);
        updateAutoResults(latestLandmarks1, box);
        redraw();
    });

    async function processCurrentFrame() {
        if (isProcessing || video1.readyState < 2 || !video1.videoWidth) return;
        isProcessing = true;
        try {
            await pose.send({ image: video1 });
        } catch(e) {} finally {
            isProcessing = false;
        }
    }

    async function loop() {
        if (!video1.paused && !video1.ended) {
            await processCurrentFrame();
        }
        animFrameId = requestAnimationFrame(loop);
    }

    video1.addEventListener('seeked', () => {
        processCurrentFrame();
    });
</script>
</body>
</html>
