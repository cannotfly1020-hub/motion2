<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>動作観察 & 骨格AI解析</title>
  <!-- MediaPipe Pose & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* スマホのアドレスバー変動に対応 */
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 全画面キャンバスコンテナ */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain; /* アスペクト比を維持しつつ画面最大化 */
    }

    /* 上部ヘッダー（半透明オーバーレイ） */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 8px);
      left: 0;
      right: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }
    .metrics {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      pointer-events: auto;
    }
    .metric-badge {
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .metric-val {
      color: #ffd43b;
      font-weight: bold;
    }

    /* 下部コントローラー（半透明オーバーレイ） */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    /* シークバーエリア */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      height: 24px;
      accent-color: #4dabf7;
      cursor: pointer;
    }
    .time-txt {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: right;
      color: #ddd;
    }

    /* ボタングループ */
    .btn-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    button, label.btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      text-align: center;
      touch-action: manipulation;
    }
    button:active, label.btn:active {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0.96);
    }
    .btn-primary {
      background: #1971c2 !important;
      border-color: #4dabf7 !important;
    }
    .btn-circle {
      flex: 0 0 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.1rem;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 全画面動画・解析描画エリア -->
  <div class="viewport">
    <video id="inputVideo" playsinline webkit-playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <!-- 上部メトリクス情報 -->
  <div class="top-bar">
    <div class="metrics">
      <div class="metric-badge">右膝: <span id="rKneeAngle" class="metric-val">--°</span></div>
      <div class="metric-badge">体幹: <span id="trunkAngle" class="metric-val">--°</span></div>
    </div>
  </div>

  <!-- 下部操作コントローラー -->
  <div class="controls-overlay">
    <div class="slider-row">
      <input type="range" id="seekBar" value="0" min="0" step="0.033" disabled>
      <span id="timeDisplay" class="time-txt">0.00s</span>
    </div>

    <div class="btn-grid">
      <label class="btn btn-primary" style="flex: 1.2;">
        📁 動画選択
        <input type="file" id="videoUploader" accept="video/*">
      </label>
      <button id="btnCamera" style="flex: 1;">📷 カメラ</button>
      <button id="btnPrevFrame" class="btn-circle" disabled>◀</button>
      <button id="btnPlayPause" class="btn-circle btn-primary" disabled>▶</button>
      <button id="btnNextFrame" class="btn-circle" disabled>▶</button>
      <button id="btnToggleGrid" style="flex: 0.8;">線</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPrevFrame = document.getElementById('btnPrevFrame');
    const btnNextFrame = document.getElementById('btnNextFrame');
    const btnCamera = document.getElementById('btnCamera');
    const uploader = document.getElementById('videoUploader');
    const rKneeSpan = document.getElementById('rKneeAngle');
    const trunkSpan = document.getElementById('trunkAngle');
    const btnToggleGrid = document.getElementById('btnToggleGrid');

    let showGrid = true;
    let isLiveCamera = false;
    let cameraUtil = null;

    // MediaPipe Pose 初期化
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360.0 - angle;
      return angle;
    }

    function calculateTrunkAngle(shoulder, hip) {
      const dx = hip.x - shoulder.x;
      const dy = hip.y - shoulder.y;
      const radians = Math.atan2(dx, dy);
      return Math.abs(radians * 180.0 / Math.PI);
    }

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 360;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // 元フレーム描画
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // グリッド線
      if (showGrid) {
        canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        canvasCtx.lineWidth = 1;
        const step = canvasElement.width / 8;
        for (let x = 0; x < canvasElement.width; x += step) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(x, 0);
          canvasCtx.lineTo(x, canvasElement.height);
          canvasCtx.stroke();
        }
        for (let y = 0; y < canvasElement.height; y += step) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(0, y);
          canvasCtx.lineTo(canvasElement.width, y);
          canvasCtx.stroke();
        }
      }

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const w = canvasElement.width;
        const h = canvasElement.height;

        const connections = [
          [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
          [11, 23], [12, 24], [23, 24],
          [23, 25], [25, 27], [24, 26], [26, 28]
        ];

        // 骨格ライン描画
        canvasCtx.strokeStyle = "#00ff88";
        canvasCtx.lineWidth = Math.max(2, Math.floor(w / 200));
        connections.forEach(([i, j]) => {
          if (lm[i].visibility > 0.5 && lm[j].visibility > 0.5) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(lm[i].x * w, lm[i].y * h);
            canvasCtx.lineTo(lm[j].x * w, lm[j].y * h);
            canvasCtx.stroke();
          }
        });

        // 関節点描画
        canvasCtx.fillStyle = "#ff0055";
        const pointRadius = Math.max(3, Math.floor(w / 150));
        lm.forEach((point) => {
          if (point.visibility > 0.5) {
            canvasCtx.beginPath();
            canvasCtx.arc(point.x * w, point.y * h, pointRadius, 0, 2 * Math.PI);
            canvasCtx.fill();
          }
        });

        // 膝角度
        if (lm[24].visibility > 0.5 && lm[26].visibility > 0.5 && lm[28].visibility > 0.5) {
          const rKnee = calculateAngle(lm[24], lm[26], lm[28]);
          rKneeSpan.innerText = `${rKnee.toFixed(1)}°`;

          canvasCtx.fillStyle = "rgba(0,0,0,0.7)";
          canvasCtx.fillRect(lm[26].x * w + 8, lm[26].y * h - 18, 55, 22);
          canvasCtx.fillStyle = "#ffd43b";
          canvasCtx.font = `bold ${Math.max(12, Math.floor(w / 40))}px sans-serif`;
          canvasCtx.fillText(`${rKnee.toFixed(0)}°`, lm[26].x * w + 12, lm[26].y * h - 3);
        }

        // 体幹傾斜
        if (lm[12].visibility > 0.5 && lm[24].visibility > 0.5) {
          const trunk = calculateTrunkAngle(lm[12], lm[24]);
          trunkSpan.innerText = `${trunk.toFixed(1)}°`;
        }
      }
      canvasCtx.restore();
    }

    // 動画読み込み
    uploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (cameraUtil) {
        cameraUtil.stop();
        isLiveCamera = false;
      }

      videoElement.src = URL.createObjectURL(file);
      videoElement.load();
      videoElement.onloadedmetadata = () => {
        seekBar.max = videoElement.duration;
        seekBar.disabled = false;
        btnPlayPause.disabled = false;
        btnPrevFrame.disabled = false;
        btnNextFrame.disabled = false;
        processCurrentVideoFrame();
      };
    });

    // カメラ起動
    btnCamera.addEventListener('click', async () => {
      if (isLiveCamera) return;
      isLiveCamera = true;
      videoElement.pause();
      
      cameraUtil = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        facingMode: 'environment', // 背面カメラ優先
        width: 1280,
        height: 720
      });
      cameraUtil.start();
      
      seekBar.disabled = true;
      btnPlayPause.disabled = true;
      btnPrevFrame.disabled = true;
      btnNextFrame.disabled = true;
    });

    async function processCurrentVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await pose.send({ image: videoElement });
        seekBar.value = videoElement.currentTime;
        timeDisplay.innerText = `${videoElement.currentTime.toFixed(2)}s`;
        requestAnimationFrame(processCurrentVideoFrame);
      } else {
        await pose.send({ image: videoElement });
        seekBar.value = videoElement.currentTime;
        timeDisplay.innerText = `${videoElement.currentTime.toFixed(2)}s`;
      }
    }

    // 再生・一時停止
    btnPlayPause.addEventListener('click', () => {
      if (videoElement.paused) {
        videoElement.play();
        btnPlayPause.innerText = '⏸';
        processCurrentVideoFrame();
      } else {
        videoElement.pause();
        btnPlayPause.innerText = '▶';
      }
    });

    seekBar.addEventListener('input', () => {
      videoElement.currentTime = parseFloat(seekBar.value);
      processCurrentVideoFrame();
    });

    // コマ戻し (1フレーム: 約0.033秒)
    btnPrevFrame.addEventListener('click', () => {
      videoElement.pause();
      btnPlayPause.innerText = '▶';
      videoElement.currentTime = Math.max(0, videoElement.currentTime - 0.033);
      setTimeout(processCurrentVideoFrame, 50);
    });

    // コマ送り
    btnNextFrame.addEventListener('click', () => {
      videoElement.pause();
      btnPlayPause.innerText = '▶';
      videoElement.currentTime = Math.min(videoElement.duration, videoElement.currentTime + 0.033);
      setTimeout(processCurrentVideoFrame, 50);
    });

    btnToggleGrid.addEventListener('click', () => {
      showGrid = !showGrid;
      processCurrentVideoFrame();
    });
  </script>
</body>
</html>
