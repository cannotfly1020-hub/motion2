<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ピッチングAIチェック - 動作分析Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    
    #header { width: 100%; background: #222; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; text-align: center; border-bottom: 2px solid #444; z-index: 30; flex-shrink: 0; }
    #header h1 { font-size: 17px; color: #30d158; margin-bottom: 4px; }
    #guideText { font-size: 11px; color: #00ffcc; }
    
    .main-btn { background: #007aff; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: inline-block; margin-top: 4px; }
    .main-btn:active { background: #005bb5; }

    #stage { width: 100%; position: relative; flex: 1; display: flex; background: #000; overflow: hidden; justify-content: center; align-items: center; min-height: 0; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    #dashboard { background: #1c1c1e; padding: 8px 12px; border-top: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
    .data-box { background: #2c2c2e; border-radius: 8px; padding: 6px 8px; text-align: center; border-left: 4px solid #555; }
    .data-box.blue { border-left-color: #007aff; }
    .data-box.orange { border-left-color: #ff9500; }
    .data-box.green { border-left-color: #30d158; }
    .data-box.red { border-left-color: #ff375f; }
    .data-box h3 { font-size: 10.5px; color: #ccc; margin-bottom: 2px; }
    .data-box .val { font-size: 17px; font-weight: bold; color: #fff; font-family: monospace; }
    .data-box .val span { font-size: 10px; color: #ffd60a; font-weight: normal; margin-left: 3px; }
    
    #controls { background: #111; padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #333; flex-shrink: 0; }
    .seek-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    input[type=range] { flex: 1; height: 26px; accent-color: #00ffcc; cursor: pointer; }
    
    .playback-row { display: flex; gap: 8px; justify-content: center; width: 100%; }
    .ctrl-btn { flex: 1; padding: 10px 0; background: #3a3a3c; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .ctrl-btn:active { background: #555; }
    #btnPlayPause { background: #007aff; color: #fff; flex: 1.4; }
</style>
</head>
<body>

<div id="header">
    <h1>⚾️ ピッチングAIチェック</h1>
    <p id="guideText">動画を選ぶとAIが体の動きを自動計算するよ！</p>
    <button class="main-btn" onclick="document.getElementById('inputFile').click()">📁 動画をえらぶ</button>
    <input type="file" id="inputFile" accept="video/*" style="display:none;">
</div>

<div id="stage">
    <video id="videoElement" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
    <canvas id="outputCanvas"></canvas>
</div>

<div id="dashboard">
    <div class="data-box blue">
        <h3>🚶 足のふみ出し幅</h3>
        <div id="res_stride" class="val">---</div>
    </div>
    <div class="data-box orange">
        <h3>💪 うでの「しなり」</h3>
        <div id="res_mer_elbow" class="val">---</div>
    </div>
    <div class="data-box green">
        <h3>🔄 体の「ひねり」</h3>
        <div id="res_xfactor" class="val">---</div>
    </div>
    <div class="data-box red">
        <h3>⚾ ボールをはなす高さ</h3>
        <div id="res_release_h" class="val">---</div>
    </div>
</div>

<div id="controls">
    <div class="seek-row">
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
    </div>
    <div class="playback-row">
        <button class="ctrl-btn" id="btnStepBack">◀ コマもどし</button>
        <button class="ctrl-btn" id="btnPlayPause">▶ 再生 / 停止</button>
        <button class="ctrl-btn" id="btnStepForward">コマおくり ▶</button>
    </div>
</div>

<script>
const video = document.getElementById('videoElement');
const outputCanvas = document.getElementById('outputCanvas');
const outCtx = outputCanvas.getContext('2d');
const seekSlider = document.getElementById('seekSlider');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnStepForward = document.getElementById('btnStepForward');
const btnStepBack = document.getElementById('btnStepBack');
const guideText = document.getElementById('guideText');

let isProcessing = false;
let animFrameId = null;

// 最大値の記憶用
let maxXFactor = 0;
let maxStride = 0;
let minElbowAngle = 180;
let maxReleaseH = 0;

// 安全な角度計算（NaNを完全防止）
function calcSafeAngle(p1, p2, p3) {
    if (!p1 || !p2 || !p3) return 0;
    const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
    const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
    const dot = v1.x * v2.x + v1.y * v2.y;
    const mag1 = Math.hypot(v1.x, v1.y);
    const mag2 = Math.hypot(v2.x, v2.y);
    if (mag1 === 0 || mag2 === 0) return 0;
    const cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
    const angle = Math.acos(cosVal) * (180 / Math.PI);
    return isNaN(angle) ? 0 : angle;
}

function fitCanvases() {
    const rect = video.parentElement.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
        outputCanvas.width = rect.width;
        outputCanvas.height = rect.height;
    }
}
window.addEventListener('resize', fitCanvases);

function getVideoRenderRect(vid, cvs) {
    if (!vid.videoWidth || !vid.videoHeight) return { width: cvs.width, height: cvs.height, x: 0, y: 0 };
    const videoRatio = vid.videoWidth / vid.videoHeight;
    const canvasRatio = cvs.width / cvs.height;
    let renderWidth, renderHeight, offsetX = 0, offsetY = 0;

    if (videoRatio > canvasRatio) {
        renderWidth = cvs.width;
        renderHeight = cvs.width / videoRatio;
        offsetY = (cvs.height - renderHeight) / 2;
    } else {
        renderHeight = cvs.height;
        renderWidth = cvs.height * videoRatio;
        offsetX = (cvs.width - renderWidth) / 2;
    }
    return { width: renderWidth, height: renderHeight, x: offsetX, y: offsetY };
}

const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.3, minTrackingConfidence: 0.3 });

pose.onResults((results) => {
    if (!results.poseLandmarks) {
        outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        return;
    }
    drawAndAnalyze(results.poseLandmarks);
});

function drawAndAnalyze(lm) {
    outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    outCtx.save();
    outCtx.lineWidth = 3.5;

    const box = getVideoRenderRect(video, outputCanvas);
    const toPx = (p) => ({ x: box.x + p.x * box.w, y: box.y + p.y * box.h });

    // 骨格線の描画
    const drawL = (p1, p2, color) => {
        if (lm[p1] && lm[p2]) {
            const pt1 = toPx(lm[p1]), pt2 = toPx(lm[p2]);
            outCtx.strokeStyle = color;
            outCtx.beginPath();
            outCtx.moveTo(pt1.x, pt1.y);
            outCtx.lineTo(pt2.x, pt2.y);
            outCtx.stroke();

            outCtx.fillStyle = '#fff';
            outCtx.beginPath(); outCtx.arc(pt1.x, pt1.y, 4, 0, Math.PI * 2); outCtx.fill();
            outCtx.beginPath(); outCtx.arc(pt2.x, pt2.y, 4, 0, Math.PI * 2); outCtx.fill();
        }
    };

    drawL(12, 14, '#ff9500'); drawL(14, 16, '#ff9500'); // 右腕
    drawL(11, 13, '#00ffcc'); drawL(13, 15, '#00ffcc'); // 左腕
    drawL(24, 26, '#ffd60a'); drawL(26, 28, '#ffd60a'); // 右脚
    drawL(23, 25, '#00ffcc'); drawL(25, 27, '#00ffcc'); // 左脚
    drawL(11, 12, '#ff375f'); drawL(23, 24, '#007aff'); // 肩・腰
    drawL(11, 23, 'rgba(255,255,255,0.4)'); drawL(12, 24, 'rgba(255,255,255,0.4)');

    // 1. 体のひねり（捻転差）
    const shL = lm[11], shR = lm[12], hipL = lm[23], hipR = lm[24];
    if (shL && shR && hipL && hipR) {
        const shAngle = Math.atan2((shR.z || 0) - (shL.z || 0), (shR.x - shL.x)) * (180 / Math.PI);
        const hipAngle = Math.atan2((hipR.z || 0) - (hipL.z || 0), (hipR.x - hipL.x)) * (180 / Math.PI);
        let xFactor = Math.abs(shAngle - hipAngle);
        if (xFactor > 90) xFactor = 180 - xFactor;
        if (!isNaN(xFactor) && xFactor > 0) {
            if (xFactor > maxXFactor) maxXFactor = xFactor;
            document.getElementById('res_xfactor').innerHTML = `${xFactor.toFixed(0)}°<span>(最大 ${maxXFactor.toFixed(0)}°)</span>`;
        }
    }

    // 2. うでのしなり（肘屈曲角度）
    const elR = lm[14], wrR = lm[16], elL = lm[13], wrL = lm[15];
    let throwSh = shR, throwEl = elR, throwWr = wrR;
    if (wrR && wrL && wrL.y < wrR.y) {
        throwSh = shL; throwEl = elL; throwWr = wrL;
    }
    if (throwSh && throwEl && throwWr) {
        const elbowAngle = calcSafeAngle(toPx(throwSh), toPx(throwEl), toPx(throwWr));
        if (elbowAngle > 0) {
            if (elbowAngle < minElbowAngle && elbowAngle > 45) minElbowAngle = elbowAngle;
            const minDisp = minElbowAngle < 180 ? ` (最深 ${minElbowAngle.toFixed(0)}°)` : '';
            document.getElementById('res_mer_elbow').innerHTML = `${elbowAngle.toFixed(0)}°<span>${minDisp}</span>`;
        }
    }

    // 3. スケール換算（画面内の人物サイズからcmを推測）
    let personHeightPx = 0;
    const head = lm[0];
    const footR = lm[28] || lm[26], footL = lm[27] || lm[25];
    if (head && (footR || footL)) {
        const lowestFootY = Math.max(footR ? toPx(footR).y : 0, footL ? toPx(footL).y : 0);
        personHeightPx = Math.abs(lowestFootY - toPx(head).y);
    }
    // 推定身長 140cm を基準に換算
    const pxPerCm = personHeightPx > 30 ? (personHeightPx / 140) : (box.h * 0.6 / 140);

    // 4. 足のふみ出し幅
    const ank1 = lm[27] || lm[25], ank2 = lm[28] || lm[26];
    if (ank1 && ank2 && pxPerCm > 0) {
        const stridePx = Math.hypot(toPx(ank1).x - toPx(ank2).x, toPx(ank1).y - toPx(ank2).y);
        const strideCm = stridePx / pxPerCm;
        if (!isNaN(strideCm) && strideCm > 10) {
            if (strideCm > maxStride) maxStride = strideCm;
            document.getElementById('res_stride').innerHTML = `${strideCm.toFixed(0)} cm<span>(最大 ${maxStride.toFixed(0)}cm)</span>`;
        }
    }

    // 5. リリース高さ
    if (throwWr && pxPerCm > 0) {
        const groundY = Math.max(footR ? toPx(footR).y : box.y + box.h, footL ? toPx(footL).y : box.y + box.h);
        const releaseHCm = Math.max(0, (groundY - toPx(throwWr).y) / pxPerCm);
        if (!isNaN(releaseHCm) && releaseHCm > 20) {
            if (releaseHCm > maxReleaseH) maxReleaseH = releaseHCm;
            document.getElementById('res_release_h').innerHTML = `${releaseHCm.toFixed(0)} cm<span>(最高 ${maxReleaseH.toFixed(0)}cm)</span>`;
        }
    }

    outCtx.restore();
}

async function processCurrentFrame() {
    if (isProcessing || video.readyState < 2 || !video.videoWidth) return;
    isProcessing = true;
    try {
        await pose.send({ image: video });
    } catch(e) {} finally {
        isProcessing = false;
    }
}

async function loop() {
    if (!video.paused && !video.ended) {
        await processCurrentFrame();
        if (video.duration) seekSlider.value = (video.currentTime / video.duration) * 100;
    }
    animFrameId = requestAnimationFrame(loop);
}

seekSlider.addEventListener('input', () => {
    if (video.duration) {
        video.pause();
        btnPlayPause.innerText = '▶ 再生 / 停止';
        btnPlayPause.style.background = '#007aff';
        video.currentTime = (seekSlider.value / 100) * video.duration;
        processCurrentFrame();
    }
});

btnPlayPause.addEventListener('click', async () => {
    if (!video.src || video.readyState < 2) return;
    if (video.paused) {
        try { 
            await video.play(); 
            btnPlayPause.innerText = '⏸ 停止'; 
            btnPlayPause.style.background = '#ff9500'; 
        } catch (e) {}
    } else {
        video.pause(); 
        btnPlayPause.innerText = '▶ 再生 / 停止'; 
        btnPlayPause.style.background = '#007aff';
        processCurrentFrame();
    }
});

btnStepForward.addEventListener('click', () => {
    if (!video.src) return;
    video.pause();
    btnPlayPause.innerText = '▶ 再生 / 停止';
    btnPlayPause.style.background = '#007aff';
    video.currentTime = Math.min(video.duration, video.currentTime + 0.033);
    processCurrentFrame();
});

btnStepBack.addEventListener('click', () => {
    if (!video.src) return;
    video.pause();
    btnPlayPause.innerText = '▶ 再生 / 停止';
    btnPlayPause.style.background = '#007aff';
    video.currentTime = Math.max(0, video.currentTime - 0.033);
    processCurrentFrame();
});

document.getElementById('inputFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    if (animFrameId) cancelAnimationFrame(animFrameId);
    video.pause();
    
    maxXFactor = 0;
    maxStride = 0;
    minElbowAngle = 180;
    maxReleaseH = 0;

    const objUrl = URL.createObjectURL(file);
    video.src = objUrl;
    video.load();
    
    const onCanPlay = () => {
        video.removeEventListener('canplay', onCanPlay);
        fitCanvases();
        btnPlayPause.innerText = '▶ 再生 / 停止';
        btnPlayPause.style.background = '#007aff';
        video.currentTime = 0.001;
        processCurrentFrame();
        guideText.innerText = "下のバーをなぞると、その瞬間の数字がぜんぶ出るよ！";
        if (!animFrameId) loop();
    };
    
    if (video.readyState >= 2) {
        onCanPlay();
    } else {
        video.addEventListener('canplay', onCanPlay);
    }
});

fitCanvases();
</script>

</body>
</html>
