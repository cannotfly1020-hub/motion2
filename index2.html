<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>投球フォームAIバイオメカニクス解析</title>
  
  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Steps Progress Bar */
    .steps-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      width: 100%;
      max-width: 500px;
    }

    .step-pill {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--surface-light);
    }

    .step-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--accent);
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--surface-light);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Views */
    .view-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 8px;
    }

    .view-section.active {
      display: flex;
    }

    /* Buttons & Controls */
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Screen Area */
    .screen-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
      max-height: 60vh;
      touch-action: none;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Guidance Text */
    .guidance-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      text-align: center;
      width: 100%;
    }

    /* Step 3 Input Form */
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }

    .input-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--surface-light);
      background: #0b1120;
      color: #fff;
      font-size: 1.25rem;
      text-align: center;
      font-weight: bold;
    }

    /* Analysis Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .dashboard {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background: #0b1120;
      border: 1px solid var(--surface-light);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .card-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .card-max {
      font-size: 0.75rem;
      color: var(--success);
      font-weight: 500;
    }

    /* Playback Controls */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .seek-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .seek-bar {
      flex: 1;
      height: 24px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .time-disp {
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--text-muted);
      min-width: 80px;
      text-align: right;
    }

    .playback-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: var(--surface-light);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ctrl:active {
      background: var(--primary);
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--surface-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚾ 投球フォームAIバイオメカニクス解析</h1>
    <div class="steps-nav">
      <div id="step-nav-1" class="step-pill active">1. 動画えらび</div>
      <div id="step-nav-2" class="step-pill">2. 選手をかこむ</div>
      <div id="step-nav-3" class="step-pill">3. 身長入力・解析</div>
    </div>
  </header>

  <main class="app-container">

    <!-- STEP 1: Video File Selection -->
    <section id="view-step1" class="view-section active">
      <div class="guidance-box">
        投球フォームの動画（横から/斜め前からのスロー動画がおすすめ）をえらんでください。
      </div>
      <label class="btn" style="padding: 24px 32px; font-size: 1.25rem;">
        📁 動画をえらぶ
        <input type="file" id="video-input" accept="video/*" style="display: none;">
      </label>
    </section>

    <!-- STEP 2: ROI Selection -->
    <section id="view-step2" class="view-section">
      <div class="guidance-box">
        まわりの人が映っていても大丈夫！投げる選手を指で四角く囲んでください。
      </div>
      <div class="screen-wrapper" id="roi-wrapper">
        <canvas id="roi-canvas"></canvas>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="btn-roi-skip">スキップ（全体）</button>
        <button class="btn" id="btn-roi-confirm">✅ この範囲で決定</button>
      </div>
    </section>

    <!-- STEP 3: Height & Start Analysis -->
    <section id="view-step3" class="view-section">
      <div class="guidance-box">
        長さ（cm）を正確に計算するために投手の身長を入力してください。
      </div>
      <div class="input-group">
        <label for="height-input">選手の身長 (cm)</label>
        <input type="number" id="height-input" class="input-field" value="140" min="80" max="220">
      </div>
      <button class="btn" id="btn-start-analysis" style="font-size: 1.1rem; padding: 14px 28px;">
        🚀 OK！解析スタート
      </button>
    </section>

    <!-- STEP 4: Main Analysis Workspace -->
    <section id="view-step4" class="view-section">
      
      <!-- Metrics Dashboard -->
      <div class="dashboard">
        <!-- 1. Stride -->
        <div class="card">
          <div class="card-title">🚶 ステップ幅</div>
          <div class="card-val" id="val-stride">-- cm</div>
          <div class="card-max" id="max-stride">最大: -- cm</div>
        </div>
        <!-- 2. Arm Cocking / Flexion -->
        <div class="card">
          <div class="card-title">💪 うでのしなり</div>
          <div class="card-val" id="val-elbow">-- °</div>
          <div class="card-max" id="min-elbow">最深: -- °</div>
        </div>
        <!-- 3. Hip-Shoulder Separation -->
        <div class="card">
          <div class="card-title">🔄 体のひねり差</div>
          <div class="card-val" id="val-twist">-- °</div>
          <div class="card-max" id="max-twist">最大: -- °</div>
        </div>
        <!-- 4. Release Height -->
        <div class="card">
          <div class="card-title">⚾ リリース高さ</div>
          <div class="card-val" id="val-release">-- cm</div>
          <div class="card-max" id="max-release">最高: -- cm</div>
        </div>
      </div>

      <!-- Main Video Rendering Display -->
      <div class="screen-wrapper" id="main-screen-wrapper">
        <canvas id="output-canvas"></canvas>
        <div class="loading-overlay" id="ai-loading" style="display: none;">
          <div class="spinner"></div>
          <div style="font-size: 0.85rem; color: #fff;">AIモデル読み込み中...</div>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="controls-container">
        <div class="seek-container">
          <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" step="0.01">
          <span class="time-disp" id="time-disp">0.00 / 0.00</span>
        </div>
        <div class="playback-buttons">
          <button class="btn-ctrl" id="btn-frame-prev">◀ -1コマ</button>
          <button class="btn-ctrl" id="btn-play-pause" style="min-width: 70px;">再生</button>
          <button class="btn-ctrl" id="btn-frame-next">+1コマ ▶</button>
          <button class="btn-ctrl" id="btn-reset-max">最大値リセット</button>
          <button class="btn-ctrl btn-secondary" id="btn-re-select">最初から</button>
        </div>
      </div>

    </section>

  </main>

  <!-- Hidden elements for Processing -->
  <video id="hidden-video" playsinline webkit-playsinline preload="auto" muted></video>
  <canvas id="buffer-canvas" style="display: none;"></canvas>

  <script>
    /* --- State Variables --- */
    let videoElement = document.getElementById('hidden-video');
    let bufferCanvas = document.getElementById('buffer-canvas');
    let bufferCtx = bufferCanvas.getContext('2d');

    let roiCanvas = document.getElementById('roi-canvas');
    let roiCtx = roiCanvas.getContext('2d');

    let outputCanvas = document.getElementById('output-canvas');
    let outputCtx = outputCanvas.getContext('2d');

    let pose = null;
    let isPoseLoaded = false;
    let isProcessing = false;
    let animationFrameId = null;

    let userHeightCm = 140;
    let videoFileUrl = null;

    // ROI Box in normalized coordinates [0.0 - 1.0]
    let roi = { x: 0, y: 0, w: 1, h: 1, isActive: false };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    // Metrics Stats Records
    let records = {
      maxStride: 0,
      minElbow: 180,
      maxTwist: 0,
      maxRelease: 0
    };

    /* --- DOM Elements --- */
    const stepViews = {
      1: document.getElementById('view-step1'),
      2: document.getElementById('view-step2'),
      3: document.getElementById('view-step3'),
      4: document.getElementById('view-step4')
    };

    const stepPills = {
      1: document.getElementById('step-nav-1'),
      2: document.getElementById('step-nav-2'),
      3: document.getElementById('step-nav-3')
    };

    const valStride = document.getElementById('val-stride');
    const maxStride = document.getElementById('max-stride');
    const valElbow = document.getElementById('val-elbow');
    const minElbow = document.getElementById('min-elbow');
    const valTwist = document.getElementById('val-twist');
    const maxTwist = document.getElementById('max-twist');
    const valRelease = document.getElementById('val-release');
    const maxRelease = document.getElementById('max-release');

    const seekBar = document.getElementById('seek-bar');
    const timeDisp = document.getElementById('time-disp');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const aiLoading = document.getElementById('ai-loading');

    /* --- Step Navigation --- */
    function setStep(stepNum) {
      Object.keys(stepViews).forEach(s => {
        stepViews[s].classList.remove('active');
      });
      if (stepViews[stepNum]) stepViews[stepNum].classList.add('active');

      Object.keys(stepPills).forEach(s => {
        stepPills[s].classList.remove('active');
      });
      if (stepNum <= 3 && stepPills[stepNum]) {
        stepPills[stepNum].classList.add('active');
      } else if (stepNum === 4 && stepPills[3]) {
        stepPills[3].classList.add('active');
      }
    }

    /* --- MediaPipe Pose Initialization --- */
    function initMediaPipe() {
      aiLoading.style.display = 'flex';
      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onPoseResults);
      pose.initialize().then(() => {
        isPoseLoaded = true;
        aiLoading.style.display = 'none';
      }).catch(err => {
        console.error("MediaPipe Load Error:", err);
        aiLoading.style.display = 'none';
      });
    }

    /* --- Step 1: Video File Selection --- */
    document.getElementById('video-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (videoFileUrl) URL.revokeObjectURL(videoFileUrl);
      videoFileUrl = URL.createObjectURL(file);
      videoElement.src = videoFileUrl;

      videoElement.onloadedmetadata = () => {
        videoElement.currentTime = 0.001; // Force render initial frame
      };

      videoElement.onseeked = () => {
        if (stepViews[2].classList.contains('active')) {
          drawRoiSetupFrame();
        } else if (stepViews[4].classList.contains('active')) {
          processSingleFrame();
        }
      };

      setStep(2);
      initRoiCanvas();
    });

    /* --- Step 2: ROI Selection Setup --- */
    function initRoiCanvas() {
      setTimeout(() => {
        const rect = roiCanvas.parentElement.getBoundingClientRect();
        roiCanvas.width = rect.width;
        roiCanvas.height = rect.height;
        drawRoiSetupFrame();
      }, 100);
    }

    function drawRoiSetupFrame() {
      if (!videoElement.videoWidth) return;

      const cw = roiCanvas.width;
      const ch = roiCanvas.height;
      roiCtx.clearRect(0, 0, cw, ch);

      const vAspect = videoElement.videoWidth / videoElement.videoHeight;
      const cAspect = cw / ch;

      let drawW, drawH, offsetX, offsetY;
      if (vAspect > cAspect) {
        drawW = cw;
        drawH = cw / vAspect;
        offsetX = 0;
        offsetY = (ch - drawH) / 2;
      } else {
        drawH = ch;
        drawW = ch * vAspect;
        offsetX = (cw - drawW) / 2;
        offsetY = 0;
      }

      roiCtx.drawImage(videoElement, offsetX, offsetY, drawW, drawH);

      // Draw Selected ROI box if any
      if (roi.isActive) {
        const rx = offsetX + roi.x * drawW;
        const ry = offsetY + roi.y * drawH;
        const rw = roi.w * drawW;
        const rh = roi.h * drawH;

        roiCtx.fillStyle = "rgba(56, 189, 248, 0.25)";
        roiCtx.fillRect(rx, ry, rw, rh);
        roiCtx.strokeStyle = "#38bdf8";
        roiCtx.lineWidth = 3;
        roiCtx.strokeRect(rx, ry, rw, rh);
      }
    }

    // Touch & Mouse drag events for ROI
    function getCanvasCoords(evt, canvas) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function getNormalizedVideoCoords(cx, cy) {
      const cw = roiCanvas.width;
      const ch = roiCanvas.height;
      const vAspect = videoElement.videoWidth / videoElement.videoHeight;
      const cAspect = cw / ch;

      let drawW, drawH, offsetX, offsetY;
      if (vAspect > cAspect) {
        drawW = cw;
        drawH = cw / vAspect;
        offsetX = 0;
        offsetY = (ch - drawH) / 2;
      } else {
        drawH = ch;
        drawW = ch * vAspect;
        offsetX = (cw - drawW) / 2;
        offsetY = 0;
      }

      const normX = Math.max(0, Math.min(1, (cx - offsetX) / drawW));
      const normY = Math.max(0, Math.min(1, (cy - offsetY) / drawH));
      return { normX, normY };
    }

    function onPointerDown(e) {
      isDragging = true;
      const coords = getCanvasCoords(e, roiCanvas);
      dragStart = coords;
      dragCurrent = coords;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      dragCurrent = getCanvasCoords(e, roiCanvas);

      drawRoiSetupFrame();

      // Draw real-time selection rectangle
      const x = Math.min(dragStart.x, dragCurrent.x);
      const y = Math.min(dragStart.y, dragCurrent.y);
      const w = Math.abs(dragStart.x - dragCurrent.x);
      const h = Math.abs(dragStart.y - dragCurrent.y);

      roiCtx.fillStyle = "rgba(56, 189, 248, 0.3)";
      roiCtx.fillRect(x, y, w, h);
      roiCtx.strokeStyle = "#38bdf8";
      roiCtx.lineWidth = 2;
      roiCtx.strokeRect(x, y, w, h);
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;

      const p1 = getNormalizedVideoCoords(dragStart.x, dragStart.y);
      const p2 = getNormalizedVideoCoords(dragCurrent.x, dragCurrent.y);

      const x = Math.min(p1.normX, p2.normX);
      const y = Math.min(p1.normY, p2.normY);
      const w = Math.abs(p1.normX - p2.normX);
      const h = Math.abs(p1.normY - p2.normY);

      if (w > 0.05 && h > 0.05) {
        roi = { x, y, w, h, isActive: true };
      } else {
        roi = { x: 0, y: 0, w: 1, h: 1, isActive: false };
      }
      drawRoiSetupFrame();
    }

    roiCanvas.addEventListener('mousedown', onPointerDown);
    roiCanvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    roiCanvas.addEventListener('touchstart', onPointerDown, { passive: true });
    roiCanvas.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    document.getElementById('btn-roi-skip').addEventListener('click', () => {
      roi = { x: 0, y: 0, w: 1, h: 1, isActive: false };
      setStep(3);
    });

    document.getElementById('btn-roi-confirm').addEventListener('click', () => {
      setStep(3);
    });

    /* --- Step 3: Height & Start Workspace --- */
    document.getElementById('btn-start-analysis').addEventListener('click', () => {
      const hVal = parseFloat(document.getElementById('height-input').value);
      userHeightCm = (!isNaN(hVal) && hVal > 50) ? hVal : 140;

      if (!pose) initMediaPipe();

      setStep(4);
      setTimeout(() => {
        resetWorkspaceDimensions();
        processSingleFrame();
      }, 150);
    });

    function resetWorkspaceDimensions() {
      const rect = outputCanvas.parentElement.getBoundingClientRect();
      outputCanvas.width = rect.width;
      outputCanvas.height = rect.height;
    }

    window.addEventListener('resize', () => {
      if (stepViews[4].classList.contains('active')) {
        resetWorkspaceDimensions();
        processSingleFrame();
      } else if (stepViews[2].classList.contains('active')) {
        initRoiCanvas();
      }
    });

    /* --- Step 4: Pose Processing & Double Buffering --- */
    function processSingleFrame() {
      if (!isPoseLoaded || isProcessing || !videoElement.videoWidth) return;

      const vw = videoElement.videoWidth;
      const vh = videoElement.videoHeight;

      // Extract ROI sub-region or full frame into Offscreen Buffer
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (roi.isActive) {
        sx = roi.x * vw;
        sy = roi.y * vh;
        sw = roi.w * vw;
        sh = roi.h * vh;
      }

      bufferCanvas.width = sw;
      bufferCanvas.height = sh;
      bufferCtx.drawImage(videoElement, sx, sy, sw, sh, 0, 0, sw, sh);

      isProcessing = true;
      pose.send({ image: bufferCanvas }).catch(err => {
        console.error("Inference Error:", err);
      }).finally(() => {
        isProcessing = false;
      });
    }

    /* --- Biomechanics Calculation Helpers --- */
    function calcAngle(a, b, c) {
      if (!a || !b || !c) return NaN;
      const v1x = a.x - b.x;
      const v1y = a.y - b.y;
      const v2x = c.x - b.x;
      const v2y = c.y - b.y;

      const mag1 = Math.sqrt(v1x * v1x + v1y * v1y);
      const mag2 = Math.sqrt(v2x * v2x + v2y * v2y);
      if (mag1 < 1e-6 || mag2 < 1e-6) return NaN;

      const dot = v1x * v2x + v1y * v2y;
      const cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
      const angle = (Math.acos(cosVal) * 180.0) / Math.PI;
      return isNaN(angle) ? NaN : angle;
    }

    function getLineAngleDeg(p1, p2) {
      if (!p1 || !p2) return NaN;
      const rad = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      return (rad * 180.0) / Math.PI;
    }

    function mapRoiToVideoCoords(lm) {
      if (!roi.isActive) return { x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility };
      return {
        x: roi.x + lm.x * roi.w,
        y: roi.y + lm.y * roi.h,
        z: lm.z,
        visibility: lm.visibility
      };
    }

    /* --- MediaPipe Results Handler --- */
    function onPoseResults(results) {
      const cw = outputCanvas.width;
      const ch = outputCanvas.height;
      if (cw === 0 || ch === 0 || !videoElement.videoWidth) return;

      outputCtx.clearRect(0, 0, cw, ch);

      // Maintain Aspect Ratio & Zero Offset Alignment
      const vAspect = videoElement.videoWidth / videoElement.videoHeight;
      const cAspect = cw / ch;

      let drawW, drawH, offsetX, offsetY;
      if (vAspect > cAspect) {
        drawW = cw;
        drawH = cw / vAspect;
        offsetX = 0;
        offsetY = (ch - drawH) / 2;
      } else {
        drawH = ch;
        drawW = ch * vAspect;
        offsetX = (cw - drawW) / 2;
        offsetY = 0;
      }

      // Draw Base Video Frame
      outputCtx.drawImage(videoElement, offsetX, offsetY, drawW, drawH);

      // If ROI active, draw subtle indicator
      if (roi.isActive) {
        outputCtx.strokeStyle = "rgba(56, 189, 248, 0.4)";
        outputCtx.lineWidth = 1;
        outputCtx.strokeRect(
          offsetX + roi.x * drawW,
          offsetY + roi.y * drawH,
          roi.w * drawW,
          roi.h * drawH
        );
      }

      if (!results.poseLandmarks) return;

      // Transform landmarks to Full Video Space
      const landmarks = results.poseLandmarks.map(mapRoiToVideoCoords);

      // Key Biomechanics Landmarks (MediaPipe Indices)
      const NOSE = landmarks[0];
      const L_SHOULDER = landmarks[11];
      const R_SHOULDER = landmarks[12];
      const L_ELBOW = landmarks[13];
      const R_ELBOW = landmarks[14];
      const L_WRIST = landmarks[15];
      const R_WRIST = landmarks[16];
      const L_HIP = landmarks[23];
      const R_HIP = landmarks[24];
      const L_ANKLE = landmarks[27];
      const R_ANKLE = landmarks[28];
      const L_HEEL = landmarks[29];
      const R_HEEL = landmarks[30];

      // Draw Custom Skeleton
      drawCustomSkeleton(landmarks, offsetX, offsetY, drawW, drawH);

      // --- Biomechanics Metrics Calculation ---

      // 1. Pixel-to-cm Scale Calibration
      // Estimate pixel height based on body landmarks (Nose / Shoulder to Ankle)
      const topRef = NOSE || { x: (L_SHOULDER.x + R_SHOULDER.x) / 2, y: (L_SHOULDER.y + R_SHOULDER.y) / 2 };
      const lowestAnkleY = Math.max(
        L_HEEL?.y || L_ANKLE?.y || 1,
        R_HEEL?.y || R_ANKLE?.y || 1
      );
      const estBodyHeightPx = Math.abs(lowestAnkleY - topRef.y) * drawH * 1.15; // 1.15 factor from head-crown to ground
      const pxPerCm = (estBodyHeightPx > 30) ? (estBodyHeightPx / userHeightCm) : (drawH * 0.7 / userHeightCm);

      // 1. Stride Width (Distance between Left and Right Ankle/Heel)
      const footLx = (L_HEEL?.x || L_ANKLE?.x || 0) * drawW;
      const footLy = (L_HEEL?.y || L_ANKLE?.y || 0) * drawH;
      const footRx = (R_HEEL?.x || R_ANKLE?.x || 0) * drawW;
      const footRy = (R_HEEL?.y || R_ANKLE?.y || 0) * drawH;
      const stridePx = Math.sqrt(Math.pow(footLx - footRx, 2) + Math.pow(footLy - footRy, 2));
      const strideCm = Math.round(stridePx / pxPerCm);

      if (!isNaN(strideCm) && strideCm > 10 && strideCm < 250) {
        valStride.textContent = `約 ${strideCm} cm`;
        if (strideCm > records.maxStride) {
          records.maxStride = strideCm;
          maxStride.textContent = `最大: ${strideCm} cm`;
        }
      }

      // 2. Throwing Arm Cocking / MER (Elbow Flexion Angle)
      // Automatically identify throwing hand (higher wrist)
      const isRightHandThrow = (R_WRIST.y < L_WRIST.y);
      const throwShoulder = isRightHandThrow ? R_SHOULDER : L_SHOULDER;
      const throwElbow = isRightHandThrow ? R_ELBOW : L_ELBOW;
      const throwWrist = isRightHandThrow ? R_WRIST : L_WRIST;

      const elbowAngle = calcAngle(throwShoulder, throwElbow, throwWrist);
      if (!isNaN(elbowAngle)) {
        const roundedElbow = Math.round(elbowAngle);
        valElbow.textContent = `${roundedElbow} °`;
        if (roundedElbow < records.minElbow && roundedElbow > 30) {
          records.minElbow = roundedElbow;
          minElbow.textContent = `最深: ${roundedElbow} °`;
        }
      }

      // 3. Hip-Shoulder Separation (X-Factor / Pelvis vs Thorax Twist)
      const shoulderAngle = getLineAngleDeg(L_SHOULDER, R_SHOULDER);
      const hipAngle = getLineAngleDeg(L_HIP, R_HIP);
      if (!isNaN(shoulderAngle) && !isNaN(hipAngle)) {
        let diff = Math.abs(shoulderAngle - hipAngle);
        if (diff > 180) diff = 360 - diff;
        const roundedTwist = Math.round(diff);
        valTwist.textContent = `${roundedTwist} °`;
        if (roundedTwist > records.maxTwist && roundedTwist < 120) {
          records.maxTwist = roundedTwist;
          maxTwist.textContent = `最大: ${roundedTwist} °`;
        }
      }

      // 4. Ball Release Ground Clearance
      const groundY = lowestAnkleY * drawH;
      const releaseHandY = throwWrist.y * drawH;
      const releaseHeightPx = Math.max(0, groundY - releaseHandY);
      const releaseHeightCm = Math.round(releaseHeightPx / pxPerCm);

      if (!isNaN(releaseHeightCm) && releaseHeightCm > 20 && releaseHeightCm < 280) {
        valRelease.textContent = `約 ${releaseHeightCm} cm`;
        if (releaseHeightCm > records.maxRelease) {
          records.maxRelease = releaseHeightCm;
          maxRelease.textContent = `最高: ${releaseHeightCm} cm`;
        }
      }
    }

    function drawCustomSkeleton(landmarks, offsetX, offsetY, drawW, drawH) {
      const connections = [
        [11, 12], [11, 13], [13, 15], // Left Arm
        [12, 14], [14, 16],           // Right Arm
        [11, 23], [12, 24], [23, 24], // Torso
        [23, 25], [25, 27],           // Left Leg
        [24, 26], [26, 28]            // Right Leg
      ];

      // Draw Lines
      outputCtx.strokeStyle = "#22c55e";
      outputCtx.lineWidth = 3;
      connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        if (p1 && p2 && (p1.visibility || 1) > 0.3 && (p2.visibility || 1) > 0.3) {
          outputCtx.beginPath();
          outputCtx.moveTo(offsetX + p1.x * drawW, offsetY + p1.y * drawH);
          outputCtx.lineTo(offsetX + p2.x * drawW, offsetY + p2.y * drawH);
          outputCtx.stroke();
        }
      });

      // Draw Landmark Dots
      landmarks.forEach((p, idx) => {
        if ([11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28].includes(idx)) {
          if ((p.visibility || 1) > 0.3) {
            outputCtx.beginPath();
            outputCtx.arc(offsetX + p.x * drawW, offsetY + p.y * drawH, 5, 0, 2 * Math.PI);
            outputCtx.fillStyle = (idx === 15 || idx === 16) ? "#f59e0b" : "#38bdf8";
            outputCtx.fill();
            outputCtx.strokeStyle = "#ffffff";
            outputCtx.lineWidth = 1.5;
            outputCtx.stroke();
          }
        }
      });
    }

    /* --- Video Playback Engine & Events --- */
    function updatePlayState() {
      if (videoElement.paused) {
        btnPlayPause.textContent = "再生";
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      } else {
        btnPlayPause.textContent = "停止";
        renderLoop();
      }
    }

    function renderLoop() {
      if (!videoElement.paused && !videoElement.ended) {
        processSingleFrame();
        updateTimeUI();
        animationFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function updateTimeUI() {
      if (!videoElement.duration) return;
      seekBar.value = (videoElement.currentTime / videoElement.duration) * 100;
      timeDisp.textContent = `${videoElement.currentTime.toFixed(2)} / ${videoElement.duration.toFixed(2)}`;
    }

    videoElement.addEventListener('play', updatePlayState);
    videoElement.addEventListener('pause', updatePlayState);
    videoElement.addEventListener('ended', updatePlayState);

    btnPlayPause.addEventListener('click', () => {
      if (videoElement.paused) {
        videoElement.play();
      } else {
        videoElement.pause();
      }
    });

    seekBar.addEventListener('input', () => {
      if (!videoElement.duration) return;
      videoElement.pause();
      videoElement.currentTime = (seekBar.value / 100) * videoElement.duration;
      updateTimeUI();
    });

    document.getElementById('btn-frame-prev').addEventListener('click', () => {
      videoElement.pause();
      videoElement.currentTime = Math.max(0, videoElement.currentTime - 0.033);
      updateTimeUI();
    });

    document.getElementById('btn-frame-next').addEventListener('click', () => {
      videoElement.pause();
      videoElement.currentTime = Math.min(videoElement.duration || 0, videoElement.currentTime + 0.033);
      updateTimeUI();
    });

    document.getElementById('btn-reset-max').addEventListener('click', () => {
      records = { maxStride: 0, minElbow: 180, maxTwist: 0, maxRelease: 0 };
      maxStride.textContent = "最大: -- cm";
      minElbow.textContent = "最深: -- °";
      maxTwist.textContent = "最大: -- °";
      maxRelease.textContent = "最高: -- cm";
    });

    document.getElementById('btn-re-select').addEventListener('click', () => {
      videoElement.pause();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      setStep(1);
    });
  </script>
</body>
</html>
